<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela Copa do Mundo 2026</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#006847;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#006847;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f1f1f1;
}
</style>
</head>

<body>

<div class="container">
    <h1>Copa do Mundo 2026</h1>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Jogo</th>
                <th>Horário</th>
                <th>Estádio</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>11/06/2026</td>
                <td>México x TBD</td>
                <td>21:00</td>
                <td>Estádio Azteca</td>
            </tr>

            <tr>
                <td>12/06/2026</td>
                <td>Estados Unidos x TBD</td>
                <td>22:00</td>
                <td>SoFi Stadium</td>
            </tr>

            <tr>
                <td>13/06/2026</td>
                <td>Canadá x TBD</td>
                <td>21:00</td>
                <td>BMO Field</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
